<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  scripts/build_gaokao_pdfs.sh 编译时使用的 fontconfig 配置（通过 FONTCONFIG_FILE 启用）。

  SVG 图里的文字由 Inkscape 渲染（gaokaozhenti.cls 设了 inkscapelatex=false），图中指定的是
  Times New Roman、SimSun（宋体）、Book Antiqua、Arial、Cambria Math 这几种 Windows 字体。
  Linux 上一般没有这些字体，换成什么字体取决于本机装了哪些字体和本机的字体配置，
  不同机器编出的 PDF 就会不同。这里把它们固定换成 apt 依赖里的字体，然后再载入系统配置：

    Times New Roman、Book Antiqua、Cambria Math → Liberation Serif（与 Times New Roman 等宽，fonts-liberation）
    SimSun                                     → AR PL SungtiL GB（文鼎 PL 简报宋，fonts-arphic-gbsn00lp，
                                                  texlive-lang-chinese 的依赖）
    Arial                                      → Liberation Sans（与 Arial 等宽）

  西文字体里没有的汉字也用 AR PL SungtiL GB，它包含图中用到的全部汉字。不用 Noto CJK：Noto CJK 里有些汉字
  和同形的康熙部首共用一个字形，Inkscape（cairo）生成的 PDF 中，这些字复制或搜索时会变成部首（如“小”变成“⼩”）。
  Noto CJK 和 DejaVu 只作为最后的后备。
-->
<fontconfig>
  <!-- 这些规则必须写在载入系统配置之前：系统配置会把 sans-serif、serif 展开成 Arial、SimSun 等字体名，
       放在后面的话，规则会误判成图中指定了这些字体 -->
  <match target="pattern">
    <test name="family" qual="any"><string>Times New Roman</string></test>
    <edit name="family" mode="prepend_first" binding="strong">
      <string>Liberation Serif</string>
      <string>AR PL SungtiL GB</string>
      <string>Noto Serif CJK SC</string>
      <string>DejaVu Serif</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family" qual="any"><string>Book Antiqua</string></test>
    <edit name="family" mode="prepend_first" binding="strong">
      <string>Liberation Serif</string>
      <string>AR PL SungtiL GB</string>
      <string>Noto Serif CJK SC</string>
      <string>DejaVu Serif</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family" qual="any"><string>Cambria Math</string></test>
    <edit name="family" mode="prepend_first" binding="strong">
      <string>Liberation Serif</string>
      <string>AR PL SungtiL GB</string>
      <string>Noto Serif CJK SC</string>
      <string>DejaVu Serif</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family" qual="any"><string>SimSun</string></test>
    <edit name="family" mode="prepend_first" binding="strong">
      <string>AR PL SungtiL GB</string>
      <string>Liberation Serif</string>
      <string>Noto Serif CJK SC</string>
      <string>DejaVu Serif</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family" qual="any"><string>Arial</string></test>
    <edit name="family" mode="prepend_first" binding="strong">
      <string>Liberation Sans</string>
      <string>AR PL SungtiL GB</string>
      <string>Noto Sans CJK SC</string>
      <string>DejaVu Sans</string>
    </edit>
  </match>

  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
</fontconfig>
