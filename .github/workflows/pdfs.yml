# PR 改动了某套卷的源文件时，用与发布相同的工具链（Ubuntu 24.04 的 TeX Live 2023、Inkscape 1.2.2）编译这几套卷：
# 编译失败（LaTeX 报错、缺字体等）时检查失败；编出的 PDF 作为本次运行的附件（artifact）保留 7 天，合并前可以下载预览。
# 改了公共文档类、宏包、编译脚本或字体配置时全部重新编译，约半小时，这时不保留附件（太大）。
# 合并后由 release.yml 编译并上传到 Release「pdf」。
name: PDF 编译

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rebuild:
    name: 编译改动的卷
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2   # PR 的合并提交及其第一个父提交（基准分支）
      - name: 找出要编译的卷
        id: targets
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            python3 scripts/changed_papers.py HEAD^1 > "$RUNNER_TEMP/targets"
          else
            echo all > "$RUNNER_TEMP/targets"
          fi
          if [ -s "$RUNNER_TEMP/targets" ]; then
            echo "any=true" >> "$GITHUB_OUTPUT"
            if grep -qx all "$RUNNER_TEMP/targets"; then echo "all=true" >> "$GITHUB_OUTPUT"; fi
            echo "要编译："; cat "$RUNNER_TEMP/targets"
          else
            echo "any=false" >> "$GITHUB_OUTPUT"
            echo "这次改动不涉及 PDF，跳过"
          fi
      - name: 安装 TeX Live、Inkscape 和字体
        if: steps.targets.outputs.any == 'true'
        run: |
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends \
            make python3 texlive-xetex texlive-lang-chinese texlive-latex-extra texlive-science \
            texlive-pictures texlive-plain-generic latexmk inkscape fonts-noto-cjk fonts-liberation
          xelatex --version | head -n1; inkscape --version
      - name: 编译
        if: steps.targets.outputs.any == 'true'
        run: |
          mapfile -t targets < "$RUNNER_TEMP/targets"
          if [ "${targets[0]}" = all ]; then
            JOBS="$(nproc)" scripts/build_gaokao_pdfs.sh 2020 2026
          else
            JOBS="$(nproc)" scripts/build_gaokao_pdfs.sh "${targets[@]}"
          fi
      - name: 保留编出的 PDF 供预览
        if: steps.targets.outputs.any == 'true' && steps.targets.outputs.all != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pdf
          path: |
            高考真题/
            专题练习/*.pdf
          retention-days: 7
          if-no-files-found: error
